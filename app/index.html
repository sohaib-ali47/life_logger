<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the safe-area insets do their job once the
         app is running full-screen from the iPhone Home Screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Life OS</title>
    <meta name="description" content="Personal operating system — log every part of your life, hit your targets, and see the patterns between them." />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS standalone: no Safari chrome once added to the Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life OS" />

    <style>
      /* Inline so it survives a stylesheet that never loaded. React clears
         #root on mount, so this is only ever visible before first paint —
         or forever, if the bundle failed, which is the point. */
      html, body { margin: 0; height: 100%; background: #0d0d0d; color: #c3c2b7;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #boot { min-height: 100vh; display: grid; place-content: center; gap: 10px;
        padding: 32px; text-align: center; }
      #boot h1 { margin: 0; font-size: 15px; font-weight: 600; color: #fff; letter-spacing: -.01em; }
      #boot p { margin: 0; font-size: 13px; max-width: 46ch; line-height: 1.5; }
      #boot pre { margin: 4px 0 0; font-size: 11.5px; text-align: left; white-space: pre-wrap;
        word-break: break-word; background: #1a1a19; border: 1px solid rgba(255,255,255,.1);
        border-radius: 10px; padding: 12px; max-width: 60ch; color: #e66767; }
      #boot button { margin-top: 6px; font: inherit; font-size: 13px; padding: 8px 14px;
        border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: #1a1a19;
        color: #fff; cursor: pointer; }
      #boot .hint { color: #898781; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <h1>Life OS</h1>
        <p id="boot-msg">Starting…</p>
      </div>
    </div>

    <script>
      // If the bundle throws before React mounts, the page would otherwise
      // just be black. Show the actual error instead — on a phone there is
      // no console to open.
      (function () {
        var shown = false;
        function report(detail) {
          if (shown) return;
          var boot = document.getElementById('boot');
          if (!boot) return;
          shown = true;
          var msg = document.getElementById('boot-msg');
          if (msg) msg.textContent = 'The app failed to start.';
          var pre = document.createElement('pre');
          pre.textContent = String(detail || 'Unknown error');
          boot.appendChild(pre);
          var hint = document.createElement('p');
          hint.className = 'hint';
          hint.textContent =
            'If this followed a deploy, a cached service worker may be serving an old build.';
          boot.appendChild(hint);
          var btn = document.createElement('button');
          btn.textContent = 'Clear cache and reload';
          btn.onclick = function () {
            var done = Promise.resolve();
            if (navigator.serviceWorker) {
              done = navigator.serviceWorker.getRegistrations()
                .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
                .catch(function () {});
            }
            done.then(function () {
              return window.caches ? caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }) : null;
            }).catch(function () {}).then(function () { location.reload(); });
          };
          boot.appendChild(btn);
        }
        window.addEventListener('error', function (e) {
          report((e.message || 'Script error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          report((e.reason && (e.reason.stack || e.reason.message)) || e.reason);
        });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
